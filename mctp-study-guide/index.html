    /* ── Week nav ── */
    .week-nav {

      border-bottom: 1px solid #e2e8f0;
      padding: 0 16px;
      display: flex;
      gap: 0;
      overflow-x: auto;
    }
    .week-btn {
      padding: 14px 18px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #64748b;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.15s, border-color 0.15s;
    }
    .week-btn:hover { color: #1e3a5f; }
    .week-btn.active { color: #1e3a5f; border-bottom-color: #1e3a5f; }

    /* ── Day nav ── */
    .day-nav {
      background: #fff;
      border-bottom: 1px solid #e2e8f0;
      padding: 10px 16px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
    }
    .day-btn {
      padding: 6px 14px;
      font-size: 0.82rem;
      font-weight: 600;
      color: #475569;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
    }
    .day-btn:hover { background: #e2e8f0; }
    .day-btn.active {
      background: #1e3a5f;
      color: #fff;
      border-color: #1e3a5f;
    }
    .day-btn.today-marker { position: relative; }
    .day-btn.today-marker::after {
      content: '';
      position: absolute;
      bottom: -3px;
      left: 50%;
      transform: translateX(-50%);
      width: 5px;
      height: 5px;
      background: #f59e0b;
      border-radius: 50%;
    }

    /* ── Main content ── */
    .content {
      max-width: 780px;
      margin: 0 auto;
      padding: 20px 16px 48px;
    }

    .day-header {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #64748b;
      margin-bottom: 14px;
    }

    /* ── Session card ── */
    .session-card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      margin-bottom: 12px;
      overflow: hidden;
    }

    .session-main {
      padding: 16px 18px;
    }

    .session-meta {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 8px;
      align-items: center;
    }
    .tag {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      letter-spacing: 0.03em;
    }
    .tag-time { background: #f1f5f9; color: #475569; }
    .tag-topic { background: #dbeafe; color: #1d4ed8; }
    .tag-coming { background: #fef3c7; color: #92400e; }
    .tag-visit  { background: #d1fae5; color: #065f46; }

    .session-title {
      font-size: 0.97rem;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 4px;
    }
    .session-speaker {
      font-size: 0.8rem;
      color: #64748b;
    }

    .session-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .btn-summary, .btn-quiz {
      padding: 7px 14px;
      font-size: 0.82rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid;
      transition: background 0.12s, color 0.12s;
    }
    .btn-summary {
      background: #f8fafc;
      border-color: #cbd5e1;
      color: #334155;
    }
    .btn-summary:hover { background: #e2e8f0; }
    .btn-summary.open { background: #1e3a5f; color: #fff; border-color: #1e3a5f; }

    .btn-quiz {
      background: #eff6ff;
      border-color: #93c5fd;
      color: #1d4ed8;
    }
    .btn-quiz:hover { background: #dbeafe; }
    .btn-quiz.open { background: #1d4ed8; color: #fff; border-color: #1d4ed8; }

    .btn-disabled {
      padding: 7px 14px;
      font-size: 0.82rem;
      font-weight: 600;
      border-radius: 6px;
      border: 1px solid #e2e8f0;
      background: #f8fafc;
      color: #cbd5e1;
      cursor: default;
    }

    /* ── Summary panel ── */
    .summary-panel {
      display: none;
      border-top: 1px solid #e2e8f0;
      padding: 16px 18px;
      background: #fafcff;
    }
    .summary-panel.open { display: block; }

    .summary-panel h4 {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #64748b;
      margin: 12px 0 7px;
    }
    .summary-panel h4:first-child { margin-top: 0; }
    .summary-panel ul { padding-left: 16px; }
    .summary-panel li, .summary-panel p {
      font-size: 0.88rem;
      color: #334155;
      line-height: 1.65;
      margin-bottom: 4px;
    }
    .summary-panel .note-box {
      margin-top: 12px;
      padding: 10px 14px;
      background: #fefce8;
      border-left: 3px solid #f59e0b;
      border-radius: 0 4px 4px 0;
      font-size: 0.85rem;
      color: #713f12;
    }

    /* ── Quiz panel ── */
    .quiz-panel {
      display: none;
      border-top: 1px solid #e2e8f0;
      padding: 16px 18px;
      background: #f8fafc;
    }
    .quiz-panel.open { display: block; }

    .quiz-score {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-bottom: 14px;
    }
    .quiz-score span { font-size: 0.82rem; color: #475569; }
    .quiz-score strong { color: #1e3a5f; }
    .btn-reset {
      margin-left: auto;
      padding: 4px 10px;
      font-size: 0.78rem;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 5px;
      cursor: pointer;
      color: #475569;
    }
    .btn-reset:hover { background: #e2e8f0; }

    .mcq-item { margin-bottom: 14px; }
    .mcq-q {
      font-size: 0.88rem;
      font-weight: 600;
      margin-bottom: 8px;
      line-height: 1.5;
    }
    .mcq-opts { display: flex; flex-direction: column; gap: 6px; }
    .mcq-opt {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 8px 10px;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.84rem;
      line-height: 1.4;
      transition: background 0.1s;
      background: #fff;
    }
    .mcq-opt:hover:not(.locked) { background: #f1f5f9; }
    .mcq-opt.correct { background: #dcfce7; border-color: #86efac; }
    .mcq-opt.wrong   { background: #fee2e2; border-color: #fca5a5; }
    .mcq-opt.show-correct { background: #dcfce7; border-color: #86efac; }

    .opt-l {
      flex-shrink: 0;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: #e2e8f0;
      color: #475569;
      font-size: 0.72rem;
      font-weight: 700;
      display: flex; align-items: center; justify-content: center;

    .mcq-opt.correct .opt-l   { background: #16a34a; color: #fff; }
    .mcq-opt.wrong .opt-l     { background: #dc2626; color: #fff; }

      margin-top: 8px;

      background: #f8fafc;
      border-left: 3px solid #1e3a5f;
      font-size: 0.82rem;
      color: #334155;

      text-align: center;
      padding: 20px;
      color: #94a3b8;
      font-size: 0.85rem;

      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 20px 18px;
      font-size: 0.88rem;
      color: #64748b;
      font-style: italic;
    }

    @media (max-width: 600px) {
      header h1 { font-size: 1.25rem; }
      .week-btn { padding: 12px 14px; font-size: 0.82rem; }
    }
  </style>

// ═══════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════

const TODAY = '2026-10-27';
let activeWeek = 'w1';
let activeDay  = TODAY;

// Per session: which panel is open ('summary'|'quiz'|null)
const openPanel = {};
// Per MCQ: { chosen, correct }
const mcqState = {};

// ═══════════════════════════════════════════════════════════
//  BUILD WEEK NAV
// ═══════════════════════════════════════════════════════════
function buildWeekNav() {
  const nav = document.getElementById('week-nav');
  nav.innerHTML = SCHEDULE.map(w => `
    <button class="week-btn ${w.weekId === activeWeek ? 'active' : ''}"
            onclick="selectWeek('${w.weekId}')">
      ${w.weekLabel} <span style="font-weight:400;opacity:.75;">${w.weekDates}</span>
    </button>
  `).join('');
}

function selectWeek(wid) {
  activeWeek = wid;
  const week = SCHEDULE.find(w => w.weekId === wid);
  // Default to today if in this week, else first day
  const dayIds = week.days.map(d => d.dateStr);
  activeDay = dayIds.includes(TODAY) ? TODAY : dayIds[0];
  buildWeekNav();
  buildDayNav();
  buildSessions();
}

// ═══════════════════════════════════════════════════════════
//  BUILD DAY NAV
// ═══════════════════════════════════════════════════════════
function buildDayNav() {
  const week = SCHEDULE.find(w => w.weekId === activeWeek);
  const nav  = document.getElementById('day-nav');
  nav.innerHTML = week.days.map(d => {
    const isToday   = d.dateStr === TODAY;
    const isCurrent = d.dateStr === activeDay;
    return `
      <button class="day-btn ${isCurrent ? 'active' : ''} ${isToday ? 'today-marker' : ''}"
              onclick="selectDay('${d.dateStr}')">
        ${d.label}${isToday ? ' ●' : ''}
      </button>
    `;
  }).join('');
}

function selectDay(dateStr) {
  activeDay = dateStr;
  buildDayNav();
  buildSessions();
}

// ═══════════════════════════════════════════════════════════
//  BUILD SESSION LIST
// ═══════════════════════════════════════════════════════════
function buildSessions() {
  const week = SCHEDULE.find(w => w.weekId === activeWeek);
  const day  = week.days.find(d => d.dateStr === activeDay);
  const hdr  = document.getElementById('day-header');
  const list = document.getElementById('session-list');

  hdr.textContent = day.full;

  if (day.admin) {
    list.innerHTML = `<div class="admin-day">${day.admin}</div>`;
    return;
  }

  if (week.placeholder || !day.sessions) {
    list.innerHTML = `<div class="admin-day" style="text-align:center;padding:32px;">
      Sessions for this week will be added as classes happen.
    </div>`;
    return;
  }

  list.innerHTML = day.sessions.map(s => renderSession(s)).join('');
}

function topicColor(topic) {
  const map = {
    'Cybercrime': '#dbeafe|#1d4ed8',
    'Leadership': '#fce7f3|#9d174d',
    'Technology': '#d1fae5|#065f46',
    'Law': '#fef3c7|#92400e',
    'Law & Order': '#fee2e2|#991b1b',
    'HR & Admin': '#ede9fe|#5b21b6',
    'Intelligence': '#e0e7ff|#3730a3',
    'Drugs': '#fef9c3|#854d0e',
    'Activity': '#f1f5f9|#475569',
    'Visit': '#d1fae5|#065f46',
  };
  const val = map[topic] || '#f1f5f9|#475569';
  const [bg, fg] = val.split('|');
  return { bg, fg };
}

function renderSession(s) {
  const { bg, fg } = topicColor(s.topic);
  const topicTag = `<span class="tag" style="background:${bg};color:${fg}">${s.topic}</span>`;
  const timeTag  = `<span class="tag tag-time">${s.time}</span>`;

  let visitBadge = '';
  if (s.isVisit) visitBadge = `<span class="tag tag-visit">${s.visitLabel}</span>`;

  let actionButtons = '';
  if (s.comingSoon) {
    actionButtons = `<span class="btn-disabled">Summary — after class</span>`;
  } else if (s.isVisit) {
    actionButtons = '';
  } else {
    const sp = openPanel[s.id];
    const hasSummary = !!s.summary;
    const summaryBtn = hasSummary
      ? `<button class="btn-summary ${sp === 'summary' ? 'open' : ''}"
                 onclick="togglePanel('${s.id}','summary')">
           ${sp === 'summary' ? '▲ Summary' : '▼ Read Summary'}
         </button>`
      : `<span class="btn-disabled">Summary — coming soon</span>`;
    const quizBtn = (s.mcqs && hasSummary)
      ? `<button class="btn-quiz ${sp === 'quiz' ? 'open' : ''}"
                 onclick="togglePanel('${s.id}','quiz')">
           ${sp === 'quiz' ? '▲ Quiz' : '⚡ Practice Quiz'}
         </button>`
      : `<span class="btn-disabled">Quiz — coming soon</span>`;
    actionButtons = summaryBtn + quizBtn;
  }

  const summaryHTML = (!s.comingSoon && !s.isVisit && s.summary) ? renderSummaryPanel(s) : '';
  const quizHTML    = (!s.comingSoon && !s.isVisit && s.mcqs)    ? renderQuizPanel(s)    : '';

  return `
    <div class="session-card" id="card-${s.id}">
      <div class="session-main">
        <div class="session-meta">
          ${timeTag}${topicTag}${visitBadge}
        </div>
        <div class="session-title">${s.title}</div>
        ${s.speaker ? `<div class="session-speaker">${s.speaker}</div>` : ''}
        ${actionButtons ? `<div class="session-actions">${actionButtons}</div>` : ''}
      </div>
      ${summaryHTML}
      ${quizHTML}
    </div>
  `;
}

function renderSummaryPanel(s) {
  const isOpen = openPanel[s.id] === 'summary';
  const sm = s.summary;
  return `
    <div class="summary-panel ${isOpen ? 'open' : ''}" id="summary-${s.id}">
      <h4>Key Points</h4>
      <ul>${sm.keypoints.map(k => `<li>${k}</li>`).join('')}</ul>
      ${sm.note ? `<div class="note-box"><strong>Note:</strong> ${sm.note}</div>` : ''}
    </div>
  `;
}

function renderQuizPanel(s) {
  const isOpen = openPanel[s.id] === 'quiz';
  const letters = ['A','B','C','D'];
  const answered = s.mcqs.map(q => mcqState[s.id + '-' + q.q.slice(0,20)]).filter(Boolean);
  const correct  = answered.filter(a => a.correct).length;

  const mcqHTML = s.mcqs.map((q, qi) => {
    const key   = s.id + '-' + q.q.slice(0,20);
    const state = mcqState[key];
    return `
      <div class="mcq-item">
        <div class="mcq-q">${qi + 1}. ${q.q}</div>
        <div class="mcq-opts">
          ${q.opts.map((opt, oi) => {
            let cls = '';
            if (state) {
              cls = ' locked';
              if (oi === q.ans) cls += state.chosen === oi ? ' correct' : ' show-correct';
              else if (oi === state.chosen) cls += ' wrong';
            }
            return `<div class="mcq-opt${cls}" onclick="answerMCQ('${key}',${oi},${q.ans},'${s.id}')">
              <span class="opt-l">${letters[oi]}</span>${opt}
            </div>`;
          }).join('')}
        </div>
        <div class="mcq-exp" id="exp-${key}" ${state ? 'style="display:block"' : ''}>
          <strong>Explanation:</strong> ${q.exp}
        </div>
      </div>
    `;
  }).join('');

  return `
    <div class="quiz-panel ${isOpen ? 'open' : ''}" id="quiz-${s.id}">
      <div class="quiz-score">
        <span>Answered: <strong>${answered.length}/${s.mcqs.length}</strong></span>
        <span>Correct: <strong>${correct}</strong></span>
        ${answered.length ? `<span>Score: <strong>${Math.round(correct/answered.length*100)}%</strong></span>` : ''}
        <button class="btn-reset" onclick="resetQuiz('${s.id}')">Reset</button>
      </div>
      ${mcqHTML}
    </div>
  `;
}

// ═══════════════════════════════════════════════════════════
//  INTERACTIONS
// ═══════════════════════════════════════════════════════════

function togglePanel(sid, panel) {
  const current = openPanel[sid];
  openPanel[sid] = current === panel ? null : panel;
  gtag('event', openPanel[sid] ? 'panel_open' : 'panel_close', { session: sid, panel });
  buildSessions();
  // Scroll the card into view
  setTimeout(() => {
    const el = document.getElementById('card-' + sid);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }, 50);
}

function answerMCQ(key, chosen, correct, sid) {
  if (mcqState[key]) return;
  const isCorrect = chosen === correct;
  mcqState[key] = { chosen, correct: isCorrect };
  gtag('event', 'mcq_answered', { session: sid, correct: isCorrect });
  buildSessions();
}

function resetQuiz(sid) {
  const week = SCHEDULE.find(w => w.weekId === activeWeek);
  const day  = week.days.find(d => d.dateStr === activeDay);
  const sess = day.sessions.find(s => s.id === sid);
  if (sess && sess.mcqs) {
    sess.mcqs.forEach(q => {
      const key = sid + '-' + q.q.slice(0,20);
      delete mcqState[key];
    });
  }
  buildSessions();
}

// ═══════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════
buildWeekNav();
buildDayNav();
buildSessions();
</script>

</html>
